t\":\"Sonic Youth\",\"year\":1988,\"tags\":[\"#1988\",\"#Alternative\"],\"genre\":\"Alternative\",\"cover\":\"https://is1-ssl.mzstatic.com/image/thumb/Music124/v4/9a/55/3b/9a553bab-12a5-a385-31b7-720087fa3130/818756010958_cover.jpg/800x800bb.jpg\",\"source\":\"iTunes\",\"sourceId\":\"520335802\",\"sourceUrl\":\"https://music.apple.com/us/album/daydream-nation-deluxe-edition/520335802?uo=4\",\"label\":\"\",\"tracks\":[],\"notes\":\"\",\"createdAt\":\"2026-10-01T00:00:00Z\",\"isExample\":true,\"yearSource\":\"$undefined\",\"yearVerified\":true,\"archived\":false},{\"id\":\"itunes-268443092\",\"title\":\"Kind of Blue\",\"artist\":\"Miles Davis\",\"year\":1959,\"tags\":[\"#1959\",\"#Jazz\"],\"genre\":\"Jazz\",\"cover\":\"https://is1-ssl.mzstatic.com/image/thumb/Music/7f/9f/d6/mzi.vtnaewef.jpg/800x800bb.jpg\",\"source\":\"iTunes\",\"sourceId\":\"268443092\",\"sourceUrl\":\"https://music.apple.com/us/album/kind-of-blue/268443092?uo=4\",\"label\":\"\",\"tracks\":[],\"notes\":\"\",\"createdAt\":\"2026-10-01T00:00:00Z\",\"isExample\":true,\"yearSource\":\"$undefined\",\"yearVerified\":true,\"archived\":false}],\"archivedAlbums\":[{\"id\":\"itunes-6795159815\",\"title\":\"In Rainbows - Single\",\"artist\":\"The_Mountain\",\"year\":2026,\"genre\":\"Electronic\",\"tags\":[\"#2026\",\"#Electronic\"],\"cover\":\"https://is1-ssl.mzstatic.com/image/thumb/Music221/v4/2e/14/15/2e1415ab-108e-d022-153a-01bf73794848/6152445653632.jpg/800x800bb.jpg\",\"source\":\"iTunes\",\"sourceId\":\"6795159815\",\"sourceUrl\":\"https://music.apple.com/us/album/in-rainbows-single/6795159815?uo=4\",\"label\":\"\",\"tracks\":[{\"title\":\"In Rainbows\",\"duration\":\"1:04\"}],\"notes\":\"\",\"createdAt\":\"2026-10-01T18:13:52.611Z\",\"isExample\":false,\"yearSource\":\"$undefined\",\"yearVerified\":false,\"archived\":true}],\"articles\":[{\"id\":\"bloom\",\"type\":\"article\",\"title\":\"在梦醒之前，再停留一会儿。\",\"excerpt\":\"Beach House 的 Bloom，让一段旋律像灯光一样，缓慢地照亮整个房间。\",\"body\":\"Bloom 的声音很大，却很少让人感到压迫。它的吉他、键盘和人声向外铺开，像一间没有明确边界的房间。\\n\\n## 光线慢慢发生\\n\\nMyth 的开头很容易让人记住。旋律没有急着去哪里，鼓点给它留出了缓慢展开的时间。Victoria Legrand 的声音在其中既清晰又遥远。\\n\\n这张专辑适合完整听完。当一首歌结束，另一首开始，你并不需要重新适应它的世界。\\n\\n## 重复的温度\\n\\n我喜欢它对重复的耐心。同一条旋律再次出现时，没有被强调成某种宣言，只是轻轻提醒你：这段感觉还在。\\n\\n最后听到的并不是一个结论，而是一点余温。那是我愿意再打开这张唱片的原因。\",\"albumId\":\"itunes-509665145\",\"author\":\"LightyearFM\",\"status\":\"published\",\"createdAt\":\"2026-10-01T00:00:00Z\",\"updatedAt\":\"2026-10-04T12:59:34.799Z\",\"audioUrl\":\"\",\"listenUrl\":\"\",\"cover\":\"\",\"albumIds\":[\"itunes-509665145\"],\"playlistIds\":[],\"category\":\"专辑评论\",\"revision\":1,\"publishedAt\":\"2026-10-01T00:00:00Z\",\"isExample\":false},{\"id\":\"rainbows\",\"type\":\"article\",\"title\":\"LightyearFM 声波光年\\n\",\"excerpt\":\"Music is all you need\",\"body\":\"欢迎来到声波光年 LightyearFM\\n\",\"albumId\":\"itunes-1373203699\",\"author\":\"LightyearFM\",\"status\":\"published\",\"createdAt\":\"2026-10-01T00:00:00Z\",\"updatedAt\":\"2026-10-02T11:07:58.689Z\",\"audioUrl\":\"\",\"listenUrl\":\"\",\"cover\":\"\",\"category\":\"专辑评论\",\"revision\":1,\"publishedAt\":\"2026-10-01T00:00:00Z\",\"isExample\":false,\"playlistIds\":[],\"albumIds\":[\"itunes-1373203699\"]},{\"id\":\"dummy\",\"type\":\"article\",\"title\":\"夜色落下来，声音才刚刚开始。\",\"excerpt\":\"重听 Portishead 的 Dummy：低沉的鼓点、唱针的噪声，以及始终没有离开的距离感。\",\"body\":\"我喜欢在夜里听 Dummy。它不是安静的唱片，但它的声音很少向你索取注意力。鼓点缓慢，人声贴近，底下却一直有一层无法忽略的颗粒感。\\n\\n## 一种靠近的方式\\n\\n[Dummy](https://open.spotify.com/track/2O6X9nPVVQSefg3xOQAo5u)\\n\\n从 Mysterons 开始，声音像被旧胶片裹住。Beth Gibbons 的演唱并不强调力量，细微的颤动反而让每一句都更有重量。\\n\\nSour Times 中的循环反复出现，像一段无法轻易离开的记忆。重复并不意味着原地不动：当你再次听见它时，情绪已经变了。\\n\\n## 留在房间里的回声\\n\\n\\n![bootlogo-preview.png](/media/50185281-6e1a-455a-bc79-0310135860c2.png)\\n\\n\\n\\nGlory Box 的声音很饱满，却仍然保留着脆弱。吉他和弦乐推着人声向前走，仿佛一个人终于决定把某句话说出来。\\n\\n听这张唱片时，我常常忘记它来自哪个年代。那些关于靠近和退后的感觉，并没有随着播放设备改变。\",\"albumId\":\"itunes-1440653096\",\"author\":\"LightyearFM\",\"status\":\"published\",\"createdAt\":\"2026-10-01T00:00:00Z\",\"updatedAt\":\"2026-10-04T11:05:24.668Z\",\"audioUrl\":\"\
